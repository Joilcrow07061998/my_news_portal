<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Новые статьи за неделю</title>
</head>

<body>

<h2>Здравствуй, {{ subscriber.username }}!</h2>

<p>
    Вот список новых статей за последнюю неделю
    в категориях, на которые ты подписан:
</p>

{% for post in posts %}

    <hr>

    <h3>{{ post.headline }}</h3>

    <p>
        {{ post.body|slice:":125" }}...
    </p>

    <p>
        <a href="http://127.0.0.1:8000/news/{{ post.pk }}/">
            Читать статью
        </a>
    </p>

{% endfor %}

</body>
</html>
